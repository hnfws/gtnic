name: Instagram scraper

on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: python -m pip install -r scraper/requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Validate scraper secrets
        env:
          LARAVEL_API_URL: ${{ secrets.LARAVEL_API_URL }}
          SCRAPER_API_TOKEN: ${{ secrets.SCRAPER_API_TOKEN }}
        run: |
          test -n "$LARAVEL_API_URL" || { echo "::error::Set the LARAVEL_API_URL Actions secret."; exit 1; }
          test -n "$SCRAPER_API_TOKEN" || { echo "::error::Set the SCRAPER_API_TOKEN Actions secret."; exit 1; }

      - name: Run scraper
        run: python scraper/igscrap.py
        env:
          LARAVEL_API_URL: ${{ secrets.LARAVEL_API_URL }}
          SCRAPER_API_TOKEN: ${{ secrets.SCRAPER_API_TOKEN }}
